  function rasterPath(index){let path=pathCache.get(index);if(path)return path;path=new Path2D(strokes[index].d);pathCache.set(index,path);if(pathCache.size>64)pathCache.delete(pathCache.keys().next().value);return path;}
  function drawStroke(target,index){const s=strokes[index];target.globalAlpha=s.opacity===undefined?1:s.opacity;target.fillStyle=s.color;target.fill(rasterPath(index));}
  function getState(){return{version:'7.2',time,totalDuration:total,presentationTime:clock.rawToPresentation(time,mode),presentationDuration:clock.duration(mode),playbackMode:mode,overviewSeconds,curve:99,speed,playing,disposed,completed,activeIndex:currentActive,activeCount:currentActive>=0&&time>strokes[currentActive].start?1:0,strokeCount:strokes.length,cachedStrokes:cachedCount,renderer:'canvas2d-completed/svg-active',mountedPaths:disposed?0:1,pendingTime,rendering:pendingTime!==null,referenceVisible:!$('reference').hidden};}
  function updateUI(frame=targetFrame(time)){
    const shown=clock.rawToPresentation(frame.t,mode);$('seek').max=clock.duration(mode);$('seek').value=shown;
    $('seek').setAttribute('aria-valuetext',`${formatTime(shown)}，完成${frame.count}笔`);
    $('elapsed').textContent=formatTime(shown);$('duration').textContent=formatTime(clock.duration(mode));
    const s=strokes[frame.active>=0?frame.active:Math.max(0,frame.count-1)],layer=data.layers?.[s?.layer];
    $('phase-label').textContent=frame.phase==='idle'?'白纸':frame.phase==='done'?(incomplete?'部分过程结束 · 粗层未完成':'绘制完成'):layer?.name||s?.phase||'逐笔绘制';
    $('mode-label').textContent=mode==='log'?'对数播放 · 先慢后快':'原始逐笔时间';
  }
  function setPending(t){pendingTime=t;$('seek-status').textContent=t===null?'':'正在定位…';$('viewport').setAttribute('aria-busy',String(t!==null));}
  function commitFrame(frame,stage,version){
    if(version!==renderVersion)return{...getState(),cancelled:true};
    // Canvas and the single growing SVG mark are committed in the same task.
    // The source photograph is never used to populate this cache.
    if(stage){context.globalAlpha=1;context.globalCompositeOperation='copy';context.drawImage(stage.canvas,0,0);context.globalCompositeOperation='source-over';}
    cachedCount=frame.count;
    activePath.removeAttribute('data-active');activePath.setAttribute('visibility','hidden');activePath.setAttribute('d','');
    if(frame.active>=0&&frame.progress>0){const s=strokes[frame.active];activePath.setAttribute('d',partialRibbonD(frame.active,frame.progress));activePath.setAttribute('fill',s.color);activePath.setAttribute('opacity',s.opacity===undefined?1:s.opacity);activePath.setAttribute('data-index',frame.active);activePath.setAttribute('visibility','visible');activePath.setAttribute('data-active','true');}
    time=frame.t;completed=frame.count;currentActive=frame.active;setPending(null);updateUI(frame);return getState();
  }
  function newStage(forward){const c=document.createElement('canvas');c.width=data.width;c.height=data.height;const target=c.getContext('2d',{alpha:false});if(forward){target.drawImage(canvas,0,0);}else{target.fillStyle='#ffffff';target.fillRect(0,0,data.width,data.height);}return{canvas:c,context:target,start:forward?cachedCount:0};}
  async function buildFrame(frame,version){const stage=newStage(frame.count>=cachedCount);let deadline=performance.now()+BUILD_BUDGET;for(let i=stage.start;i<frame.count;i++){if(version!==renderVersion)return{...getState(),cancelled:true};drawStroke(stage.context,i);if(performance.now()>=deadline){await new Promise(resolve=>setTimeout(resolve,0));deadline=performance.now()+BUILD_BUDGET;}}return commitFrame(frame,stage,version);}
  function renderAt(value){if(disposed)return Promise.resolve({...getState(),cancelled:true});const frame=targetFrame(value),version=++renderVersion,missing=frame.count-cachedCount;if(missing<0||missing>SYNC_LIMIT){setPending(frame.t);pendingPromise=buildFrame(frame,version);return pendingPromise;}for(let i=cachedCount;i<frame.count;i++)drawStroke(context,i);const result=commitFrame(frame,null,version);pendingPromise=Promise.resolve(result);return pendingPromise;}
  function cancelPending(){if(pendingTime!==null){renderVersion++;setPending(null);pendingPromise=Promise.resolve(getState());}}
  function updatePlay(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing));}
  async function tick(now,version){if(!playing||version!==playbackVersion)return;const delta=Math.max(0,now-lastFrame);lastFrame=now;await renderAt(clock.advance(time,delta,mode,speed));if(!playing||version!==playbackVersion)return;if(time>=total){pause();return;}request=requestAnimationFrame(next=>tick(next,version));}
  function play(){if(playing||disposed)return;cancelPending();if(time>=total)renderAt(0);playing=true;const version=++playbackVersion;lastFrame=performance.now();updatePlay();request=requestAnimationFrame(now=>tick(now,version));}
  function pause(){playing=false;playbackVersion++;cancelAnimationFrame(request);request=0;cancelPending();updatePlay();}
  function dispose(){if(disposed)return;pause();disposed=true;renderVersion++;group.replaceChildren();geometryCache.clear();pathCache.clear();cachedCount=0;currentActive=-1;canvas.width=canvas.width;context.fillStyle='#ffffff';context.fillRect(0,0,data.width,data.height);pendingPromise=Promise.resolve();}
  function next(){pause();const i=upperBoundEnd(time);return i<strokes.length?renderAt(strokes[i].start+strokes[i].duration):Promise.resolve(getState());}
  function prev(){pause();const i=upperBoundEnd(time);if(i<strokes.length&&time>strokes[i].start)return renderAt(strokes[i].start);return renderAt(i?strokes[i-1].start:0);}
  function setPlaybackMode(value){if(value!=='log'&&value!=='real')throw new RangeError('Unknown playback mode');mode=value;$('playback-mode').value=mode;$('overview-field').hidden=mode==='real';$('mode-hint').textContent=mode==='log'?'对数播放保留原有笔序，前段慢看形体，后段逐渐加速。方向键可逐笔查看。':'按每笔记录的原始时长播放。方向键可逐笔查看。';lastFrame=performance.now();updateUI();return getState();}
  function setOverviewDuration(value){const seconds=Math.max(60,Math.min(900,Number(value)||240));overviewSeconds=seconds;clock=PaintingClock.createClock(total,seconds*1000,99);$('overview-seconds').value=seconds;lastFrame=performance.now();updateUI();return getState();}
  function toggleReference(){const showing=$('reference').hidden;$('reference').hidden=!showing;canvas.hidden=showing;if(showing)svg.setAttribute('hidden','');else svg.removeAttribute('hidden');$('reference-toggle').textContent=showing?'返回绘画':'查看原图';$('reference-toggle').setAttribute('aria-pressed',String(showing));return showing;}
  async function generatorSource(){const raw=$('generator-source').textContent;let value;try{value=JSON.parse(raw);}catch{return{source:raw,filename:'build_person_painting_v7.py'};}return{source:await decode(value,true),filename:value.filename||'build_person_painting_v7.py'};}
  on($('download-generator'),'click',async()=>{const button=$('download-generator');button.disabled=true;try{const result=await generatorSource(),url=URL.createObjectURL(new Blob([result.source],{type:'text/x-python;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=result.filename.split(/[\\/]/).pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(error){button.textContent=error.message;}finally{button.disabled=false;}});
  on($('play'),'click',()=>playing?pause():play());on($('restart'),'click',()=>{pause();renderAt(0);});on($('seek'),'input',event=>{pause();renderAt(clock.presentationToRaw(event.target.value,mode));});on($('speed'),'change',event=>{speed=Number(event.target.value);lastFrame=performance.now();});on($('playback-mode'),'change',event=>setPlaybackMode(event.target.value));on($('overview-seconds'),'change',event=>setOverviewDuration(event.target.value));on($('reference-toggle'),'click',toggleReference);
  on(document,'keydown',event=>{if(event.target.matches('input,select,textarea,button,summary')||event.altKey||event.ctrlKey||event.metaKey)return;if(event.code==='Space'){event.preventDefault();playing?pause():play();}else if(event.key==='ArrowRight'){event.preventDefault();next();}else if(event.key==='ArrowLeft'){event.preventDefault();prev();}else if(event.key==='Home'){event.preventDefault();pause();renderAt(0);}else if(event.key==='End'){event.preventDefault();pause();renderAt(total);}});
  on(document,'visibilitychange',()=>{if(document.hidden)pause();});
  const ready=renderAt(0);
  window.paintingAPI={data,renderAt,targetFrame,getState,play,pause,dispose,next,prev,setPlaybackMode,setOverviewDuration,toggleReference,partialRibbonD,getGeneratorSource:generatorSource,clock:()=>clock,whenRendered:()=>pendingPromise,ready};
  await ready;updatePlay();$('loading').hidden=true;window.dispatchEvent(new Event('paintingready'));
  }
  sampleSelect.addEventListener('change',async()=>{sampleSelect.disabled=true;try{await initializePainting(paintings[Number(sampleSelect.value)].data);}catch(error){window.paintingError=error.message;$('seek-status').textContent=error.message;}finally{sampleSelect.disabled=false;}});
  await initializePainting(paintings[0].data);
})().catch(error=>{console.error(error);document.getElementById('loading').innerHTML='';const message=document.createElement('p');message.className='error';message.textContent='无法打开画谱：'+error.message;document.getElementById('loading').appendChild(message);window.paintingError=error.message;});
</script>
